# The "Report a bug" form behind Issues -> New issue. Every box says where to
# find the answer. The Mac model matters (notch sizes differ), and so does a
# phone photo: a screenshot doesn't show the notch the way the eye does.
name: Report a bug
description: Something in MatchNotch isn't working the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Fill in what you can; every box says where to find the answer.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? Which match, if it was during one?
      placeholder: |
        Arsenal v Chelsea was on. I expected the score beside the notch, but nothing showed.
    validations:
      required: true

  - type: textarea
    id: photo
    attributes:
      label: A photo of the notch
      description: |
        Take a photo of the top of your screen **with your phone** and drag it in here.
        A screenshot often doesn't show the notch the way you see it.
    validations:
      required: false

  - type: input
    id: mac
    attributes:
      label: Your Mac
      description: Apple menu → **About This Mac**. Copy the name and size shown at the top.
      placeholder: MacBook Air, 13-inch, M2, 2022
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Also in **About This Mac**, next to "macOS".
      placeholder: Sequoia 15.7
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: MatchNotch version
      description: In Finder, open **Applications**, right-click **MatchNotch** → **Get Info**, and look at "Version".
      placeholder: "1.0"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Downloaded the .dmg
        - Homebrew
    validations:
      required: true
