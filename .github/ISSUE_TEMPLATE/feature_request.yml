# The "Suggest an idea" form. Short on purpose: an idea needs the problem it
# solves more than it needs a spec.
name: Suggest an idea
description: Something MatchNotch could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the idea, and what it would help you do.
      placeholder: I'd like to follow La Liga clubs too.
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: A sketch, a screenshot of another app that does it, or why it matters to you.
    validations:
      required: false
